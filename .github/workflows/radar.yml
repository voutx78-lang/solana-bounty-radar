name: refresh bounty snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "35 17 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Refresh public snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python bounty_radar.py --format json --stable --output data/latest.json
      - name: Commit changed opportunities
        run: |
          if git diff --quiet -- data/latest.json; then
            exit 0
          fi
          git config user.name "solana-bounty-radar[bot]"
          git config user.email "solana-bounty-radar[bot]@users.noreply.github.com"
          git add data/latest.json
          git commit -m "Refresh bounty snapshot"
          git push
