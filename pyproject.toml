[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solana-bounty-radar"
version = "1.0.0"
description = "Find and risk-screen public Solana and Web3 bounty opportunities"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "voutx78-lang" }]
keywords = ["solana", "bounties", "web3", "agents", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]

[project.scripts]
solana-bounty-radar = "bounty_radar:main"

[tool.setuptools]
py-modules = ["bounty_radar"]
